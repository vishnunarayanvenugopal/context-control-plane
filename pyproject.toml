[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccp-core"
version = "0.1.0"
description = "Open-source vendor-neutral control-plane kernel for AI agents, MCP integrations, governed execution, traceability, and safe secret handling."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "CCP Core Contributors" }
]
license = { file = "LICENSE" }
keywords = [
  "context-control-plane",
  "control-plane",
  "ai-agents",
  "mcp",
  "governed-execution",
  "traceability",
  "secret-handling",
  "policy"
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.optional-dependencies]
dev = ["pre-commit>=3.7"]

[project.scripts]
ccp = "context_control_plane.cli:main"

[tool.setuptools]
package-dir = {"" = "sdk/python"}

[tool.setuptools.packages.find]
where = ["sdk/python"]
